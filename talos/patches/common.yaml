# Applied to every node on top of `talosctl gen config`. Per-node addresses
# and hostnames are in node1-3.yaml. Addressing is from docs/network.md.

# etcd peers talk over mgmt, never the storage VLAN.
version: v1alpha1
cluster:
  etcd:
    advertisedSubnets:
      - 10.10.10.0/24
---
# Each M910q has exactly one wired NIC (Intel I219-LM). Naming it by driver
# means no per-node MAC addresses are needed.
apiVersion: v1alpha1
kind: LinkAliasConfig
name: lan
selector:
  match: link.driver == "e1000e"
---
# Kubernetes API VIP, held by one control-plane node at a time.
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.10.10.10
link: lan
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 10.10.10.1
---
# Kubelet must register the mgmt address, not the storage VLAN one.
# The control-plane taint is removed so all three nodes run workloads, and
# so are the default labels: one of them, exclude-from-external-load-
# balancers, would stop these nodes announcing LoadBalancer IPs (phase 3).
# node-labels.yaml adds the control-plane role label back. The keys can't be
# deleted one by one: patch paths split on their dots.
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.10.10.0/24
taints:
  $patch: delete
labels:
  $patch: delete
---
# Cilium replaces both kube-proxy and Flannel (phase 3).
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - k8s.hamzatest.com
  - 10.10.10.10
---
# Install to the 256 GB boot NVMe. The size bound keeps a future, larger data
# disk in the second M.2 slot from ever being picked.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.transport == "nvme" && disk.size < 300u * GB
---
# Cap Talos's own space so the rest of the boot disk stays free for the
# storage phase. EPHEMERAL can't shrink after install, so it's set now.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 100GiB
