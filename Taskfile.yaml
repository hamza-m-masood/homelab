version: "3"

vars:
  ROUTER: network/routeros
  ROUTER_SECRETS: network/routeros/secrets.sops.yaml
  TALOS_SECRETS: talos/secrets.sops.yaml

dotenv:
  - talos/talos.env

env:
  SOPS_AGE_KEY_FILE:
    sh: echo "${SOPS_AGE_KEY_FILE:-$HOME/.config/sops/age/keys.txt}"
  TALOSCONFIG: "{{.ROOT_DIR}}/talos/out/talosconfig"
  KUBECONFIG: "{{.ROOT_DIR}}/talos/out/kubeconfig"

tasks:
  age:init:
    desc: Create this machine's age key (once) and put its public key in .sops.yaml
    status:
      - test -f "$SOPS_AGE_KEY_FILE"
    cmds:
      - mkdir -p "$(dirname "$SOPS_AGE_KEY_FILE")"
      - age-keygen -o "$SOPS_AGE_KEY_FILE"
      - perl -pi -e "s/age1PLACEHOLDER/$(age-keygen -y "$SOPS_AGE_KEY_FILE")/" .sops.yaml
      - echo "Back up $SOPS_AGE_KEY_FILE (password manager). It decrypts every secret in this repo."

  router:secrets:
    desc: Generate the router's secrets into an encrypted secrets.sops.yaml (once)
    status:
      - test -f {{.ROUTER_SECRETS}}
    cmds:
      # Hex only: the passwords end up inside a RouterOS script.
      - >-
        printf 'ROUTEROS_ADMIN_PASSWORD: "%s"\nTF_VAR_routeros_password: "%s"\nTF_VAR_state_passphrase: "%s"\nTF_VAR_wifi_passphrase: "%s"\n'
        "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" "$(openssl rand -hex 24)" "$(openssl rand -hex 8)"
        > {{.ROUTER_SECRETS}}
      - sops encrypt -i {{.ROUTER_SECRETS}}

  router:bootstrap:
    desc: Render out/bootstrap.rsc with the passwords filled in (upload it, then delete it)
    cmds:
      - mkdir -p {{.ROUTER}}/out
      - >-
        sops exec-env {{.ROUTER_SECRETS}}
        'scripts/fill-template.sh {{.ROUTER}}/bootstrap.rsc ROUTEROS_ADMIN_PASSWORD TF_VAR_routeros_password
        > {{.ROUTER}}/out/bootstrap.rsc'
      - echo "Wrote {{.ROUTER}}/out/bootstrap.rsc"

  router:init:
    desc: Download the RouterOS provider
    cmds:
      - sops exec-env {{.ROUTER_SECRETS}} 'tofu -chdir={{.ROUTER}} init'

  # -compact-warnings: provider 1.99.1 warns about every RouterOS 7.25 field it
  # doesn't know yet ("not found in the schema"). Harmless; one line each.
  router:plan:
    desc: Show what would change on the router
    cmds:
      - sops exec-env {{.ROUTER_SECRETS}} 'tofu -chdir={{.ROUTER}} plan -compact-warnings -out=router.tfplan'

  router:apply:
    desc: Apply the last plan
    cmds:
      - sops exec-env {{.ROUTER_SECRETS}} 'tofu -chdir={{.ROUTER}} apply -compact-warnings router.tfplan'

  router:output:
    desc: Print outputs (e.g. the WireGuard public key)
    cmds:
      - sops exec-env {{.ROUTER_SECRETS}} 'tofu -chdir={{.ROUTER}} output'

  talos:schematic:
    desc: Register talos/schematic.yaml with Image Factory and print its ID (goes in talos/talos.env)
    cmds:
      - curl -fsS -X POST --data-binary @talos/schematic.yaml https://factory.talos.dev/schematics
      - echo

  talos:iso:
    desc: Print the boot ISO URL for the pinned schematic and version
    cmds:
      - echo "https://factory.talos.dev/image/$TALOS_SCHEMATIC/$TALOS_VERSION/metal-amd64.iso"

  talos:secrets:
    desc: Generate the cluster's secrets bundle into an encrypted secrets.sops.yaml (once)
    status:
      - test -f {{.TALOS_SECRETS}}
    cmds:
      - talosctl gen secrets --output-file {{.TALOS_SECRETS}}
      - sops encrypt -i {{.TALOS_SECRETS}}

  talos:gen:
    desc: Render talos/out/node1-3.yaml and talosconfig (gitignored)
    cmds:
      - sops exec-file --no-fifo {{.TALOS_SECRETS}} 'scripts/talos-gen.sh {} talos/out'

  talos:validate:
    desc: Render and validate the configs with throwaway secrets (what CI runs)
    cmds:
      - rm -rf talos/out/validate && mkdir -p talos/out/validate
      - talosctl gen secrets --output-file talos/out/validate/secrets.yaml
      - scripts/talos-gen.sh talos/out/validate/secrets.yaml talos/out/validate
      - rm -rf talos/out/validate

  talos:install:
    desc: "First install from maintenance mode: task talos:install NODE=node1 IP=<its DHCP address>"
    requires:
      vars: [NODE, IP]
    cmds:
      - talosctl apply-config --insecure --nodes {{.IP}} --file talos/out/{{.NODE}}.yaml

  talos:apply:
    desc: "Apply config changes to a running node: task talos:apply NODE=node1"
    requires:
      vars: [NODE]
    cmds:
      - talosctl apply-config --nodes 10.10.10.1{{trimPrefix "node" .NODE}} --file talos/out/{{.NODE}}.yaml

  talos:bootstrap:
    desc: Start etcd on node1 (once per cluster, after the nodes are installed)
    cmds:
      - talosctl bootstrap --nodes 10.10.10.11

  talos:kubeconfig:
    desc: Write talos/out/kubeconfig
    cmds:
      - talosctl kubeconfig talos/out/kubeconfig --nodes 10.10.10.11 --force --merge=false

  talos:upgrade:
    desc: "Upgrade one node to TALOS_VERSION and the pinned schematic: task talos:upgrade NODE=node1"
    requires:
      vars: [NODE]
    cmds:
      - talosctl upgrade --nodes 10.10.10.1{{trimPrefix "node" .NODE}} --image "factory.talos.dev/metal-installer/$TALOS_SCHEMATIC:$TALOS_VERSION"

  talos:upgrade-k8s:
    desc: Upgrade Kubernetes on all nodes to KUBERNETES_VERSION
    cmds:
      - talosctl upgrade-k8s --nodes 10.10.10.11 --to "$KUBERNETES_VERSION"

  lint:
    desc: Formatting and static checks (CI also runs tofu validate)
    cmds:
      - tofu fmt -check -recursive network
      - shellcheck scripts/*.sh
      - task: talos:validate
