name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -check -recursive network

      - name: tofu validate
        working-directory: network/routeros
        env:
          # validate never reads state; encryption just needs a value.
          TF_VAR_state_passphrase: ci-validate-only-not-a-secret
        run: |
          tofu init -backend=false -input=false
          tofu validate

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Install talosctl
        run: |
          source talos/talos.env
          curl -fsSL -o talosctl "https://github.com/siderolabs/talos/releases/download/$TALOS_VERSION/talosctl-linux-amd64"
          sudo install -m 755 talosctl /usr/local/bin/talosctl && rm talosctl

      # Same as `task talos:validate`: render all three nodes with throwaway
      # secrets and validate them in metal mode.
      - name: Talos configs
        run: |
          out=$(mktemp -d)
          talosctl gen secrets --output-file "$out/secrets.yaml"
          scripts/talos-gen.sh "$out/secrets.yaml" "$out"

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
