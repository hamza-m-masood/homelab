# Pinned CLI versions: `mise install` in the repo root.
[tools]
opentofu = "1.13.2"
sops = "3.13.3"
age = "1.3.2"
task = "3.54.0"
shellcheck = "0.11.0"
# Keep talosctl in step with TALOS_VERSION in talos/talos.env.
talosctl = "1.14.5"
kubectl = "1.37.1"

[env]
# Same path on macOS and Linux (sops' macOS default is under ~/Library).
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/keys.txt"
# So talosctl and kubectl reach the lab from anywhere in the repo. Written by
# `task talos:gen` and `task talos:kubeconfig`.
TALOSCONFIG = "{{config_root}}/talos/out/talosconfig"
KUBECONFIG = "{{config_root}}/talos/out/kubeconfig"
